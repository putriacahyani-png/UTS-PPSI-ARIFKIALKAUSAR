    // Helper: LocalStorage Loader with Fallback
    const loadStorage = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        console.warn(`Error reading localStorage ${key}:`, e);
        return fallback;
      }
    };

    const saveStorage = (key, data) => {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {
        console.warn(`Error saving localStorage ${key}:`, e);
      }
    };

    // Helper: Status badge color classes

      switch(status) {
        case 'Menunggu Validasi': return 'bg-amber-100 text-amber-800 border-amber-300';
        case 'Diverifikasi': return 'bg-blue-100 text-blue-800 border-blue-300';
        case 'Diterima':
        case 'Diterima / SPK Diterbitkan': return 'bg-emerald-100 text-emerald-800 border-emerald-300';
        case 'Dalam Perbaikan': return 'bg-purple-100 text-purple-800 border-purple-300';
        case 'Selesai': return 'bg-green-100 text-green-900 border-green-300';
        case 'Ditolak': return 'bg-rose-100 text-rose-800 border-rose-300';
        default: return 'bg-slate-100 text-slate-800 border-slate-300';
      }
    };

        case 'Berat': return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700"><span className="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></span>Kritis / Berat</span>;
        case 'Sedang': return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-700">Sedang</span>;
        default: return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">Ringan</span>;
      }
    };

    const formatSLA = (seconds) => {
      if (seconds <= 0) return 'Tuntas / PHO';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };

      // 1. Authenticated state & persistent user session
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return localStorage.getItem(STORAGE_KEYS.AUTH) === 'true';
      });

      const [currentUser, setCurrentUser] = useState(() => {
        return loadStorage(STORAGE_KEYS.CURRENT_USER, INITIAL_USERS[0]);
      });

      const [users, setUsers] = useState(() => {
        return loadStorage(STORAGE_KEYS.USERS, INITIAL_USERS);
      });

      const [activeTab, setActiveTab] = useState('dashboard');

      // 5. Data states with automatic LocalStorage synchronization
      const [reports, setReports] = useState(() => {
        return loadStorage(STORAGE_KEYS.REPORTS, INITIAL_REPORTS);
      });

      const [roads, setRoads] = useState(() => {
        return loadStorage(STORAGE_KEYS.ROADS, INITIAL_ROADS);
      });

      const [auditLogs, setAuditLogs] = useState(() => {
        return loadStorage(STORAGE_KEYS.AUDIT, INITIAL_AUDIT_LOGS);
      });

      // Modals & UI States
      const [selectedReport, setSelectedReport] = useState(null);
      const [auditModalData, setAuditModalData] = useState(null);
      const [rejectModalReport, setRejectModalReport] = useState(null);
      const [rejectReasonText, setRejectReasonText] = useState('');
      const [showLogoutModal, setShowLogoutModal] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Mobile sidebar toggle state
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // Save to localStorage on state changes
      useEffect(() => {
        saveStorage(STORAGE_KEYS.REPORTS, reports);
      }, [reports]);

      useEffect(() => {
        saveStorage(STORAGE_KEYS.ROADS, roads);
      }, [roads]);

      useEffect(() => {
        saveStorage(STORAGE_KEYS.USERS, users);
      }, [users]);

      useEffect(() => {
        saveStorage(STORAGE_KEYS.AUDIT, auditLogs);
      }, [auditLogs]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEYS.AUTH, isAuthenticated ? 'true' : 'false');
        if (currentUser) {
          // SEC-05: Ensure password is never stored into current user session
          const { password, ...safeUser } = currentUser;
          saveStorage(STORAGE_KEYS.CURRENT_USER, safeUser);
        }
      }, [isAuthenticated, currentUser]);

      // SLA Countdown Tick (Updates every 1s)
      useEffect(() => {
        const timer = setInterval(() => {
          setReports(prev => prev.map(r => ({
            ...r,
            sla_seconds_left: r.sla_seconds_left > 0 ? r.sla_seconds_left - 1 : 0
          })));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Trigger Lucide icons refresh
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);

    // STEPPER FORM WITH MAGIC BYTES VERIFICATION & INPUT SANITIZATION (SEC-07 & SEC-XSS)
    function CreateReportStepper({ onSuccess, onCancel, currentUser }) {
      const [step, setStep] = useState(1);
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('cat-1');
      const [severity, setSeverity] = useState('Sedang');
      const [desc, setDesc] = useState('');
      const [district, setDistrict] = useState(LAMPUNG_DISTRICTS[0]);
      const [address, setAddress] = useState('Jl. ZA Pagar Alam No. 9, Kedaton');
      const [lat, setLat] = useState(-5.381423);
      const [lng, setLng] = useState(105.257122);

      // Photo upload state
      const [photoUrl, setPhotoUrl] = useState('https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=800&q=80');
      const [uploadedFileName, setUploadedFileName] = useState('pothole_sample_01.jpg');
      const [uploadedFileSize, setUploadedFileSize] = useState('2.4 MB');
      const fileInputRef = useRef(null);

      // SEC-07: Validasi berkas biner (Magic Bytes) dan sanitasi nama berkas
      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 1. Validasi ukuran berkas (maksimal 5 MB)
        const maxSize = 5 * 1024 * 1024;
        if (file.size > maxSize) {
          alert('Ukuran file terlalu besar! Ukuran file maksimal adalah 5 MB.');
          e.target.value = '';
          return;
        }

        // 2. Sanitasi nama berkas agar bebas dari path traversal dan karakter berbahaya
        const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

        // 3. Verifikasi tanda biner berkas asli (Magic Bytes Verification)
        const bufferReader = new FileReader();
        bufferReader.onloadend = (evt) => {
          if (!evt.target.result) return;
          const arr = new Uint8Array(evt.target.result).subarray(0, 4);
          let header = '';
          for (let i = 0; i < arr.length; i++) {
            header += arr[i].toString(16).padStart(2, '0').toUpperCase();
          }

          // Validasi header biner:
          // JPEG: FFD8FF
          // PNG: 89504E47
          // WEBP: 52494646 (RIFF header)
          const isJPEG = header.startsWith('FFD8FF');
          const isPNG = header.startsWith('89504E47');
          const isWEBP = header.startsWith('52494646');

          if (!isJPEG && !isPNG && !isWEBP) {
            alert('Keamanan Terpicu: Berkas terdeteksi bukan berkas gambar valid (Magic Bytes Signature tidak cocok). Hanya format JPG, PNG, atau WEBP asli yang diizinkan!');
            e.target.value = '';
            return;
          }

          // Berkas gambar terverifikasi aman: Baca ke Base64 Data URL untuk pratinjau
          const dataUrlReader = new FileReader();
          dataUrlReader.onload = (event) => {
            setPhotoUrl(event.target.result);
            setUploadedFileName(cleanName);
            setUploadedFileSize(`${(file.size / (1024 * 1024)).toFixed(2)} MB`);
          };
          dataUrlReader.readAsDataURL(file);
        };
        bufferReader.readAsArrayBuffer(file.slice(0, 8));
      };

      // Inisialisasi Peta Leaflet pada langkah 2
      useEffect(() => {
        if (step === 2) {
          const mapEl = document.getElementById('report-picker-map');
          if (mapEl && !mapEl._leaflet_id) {
            const map = L.map('report-picker-map').setView([lat, lng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            let marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            marker.on('dragend', function(e) {
              const pos = marker.getLatLng();
              setLat(Number(pos.lat.toFixed(6)));
              setLng(Number(pos.lng.toFixed(6)));
            });

            map.on('click', function(e) {
              marker.setLatLng(e.latlng);
              setLat(Number(e.latlng.lat.toFixed(6)));
              setLng(Number(e.latlng.lng.toFixed(6)));
            });
          }
        }
      }, [step]);

      const handleSubmit = () => {
        // SEC-XSS: Sanitasi teks input sebelum penyimpanan
        const cleanTitle = escapeHtml(title.trim());
        const cleanDesc = escapeHtml(desc.trim());
        const cleanAddress = escapeHtml(address.trim());

        if (!cleanTitle || !cleanDesc) {
          alert('Judul dan deskripsi laporan wajib diisi!');
          return;
        }

        const catObj = CATEGORIES.find(c => c.id === category);
        const newReport = {
          id: `rpt-${Date.now()}`,
          report_code: `#RPT-2026-${Math.floor(1000 + Math.random() * 9000)}`,
          reporter_name: currentUser.name,
          reporter_nik_masked: currentUser.nik ? `${currentUser.nik.slice(0, 6)}********${currentUser.nik.slice(-2)}` : '187102********91',
          reporter_reputation: currentUser.reputation_score || 96,
          road_name: 'Ruas Jalan Provinsi Terverifikasi',
          district: district,
          subdistrict: 'Kecamatan Terdata',
          category_name: catObj ? catObj.name : 'Jalan Berlubang',

          severity: severity,
          latitude: lat,
          longitude: lng,
          address: cleanAddress,
          status: 'Menunggu Validasi',
          ai_urgency_score: severity === 'Berat' ? 8.9 : severity === 'Sedang' ? 6.5 : 4.0,
          sla_seconds_left: 86400, // 24 hours
          created_at: '14 Mei 2026, 19:40 WIB',
          photos: {
            before: photoUrl,
            in_progress: null,
            after: null
          },
          histories: [
            {
              status: 'Menunggu Validasi',
              time: '14 Mei 2026 19:40',
              note: 'Laporan baru dibuat dan masuk antrean verifikasi teknis UPTD.',
              by: currentUser.name
            }
          ]
        };

        onSuccess(newReport);
      };

      return (
        <div className="max-w-4xl mx-auto p-5 sm:p-8 rounded-3xl bg-white border border-surface-container shadow-lg">
          <div className="flex items-center justify-between pb-6 mb-6 border-b border-surface-container">
            <div>
              <h2 className="font-heading font-extrabold text-lg sm:text-xl text-primary">Formulir Laporan Kerusakan Jalan</h2>
              <p className="text-xs text-on-surface-variant">Lengkapi data agar petugas UPTD dapat melakukan penanganan presisi</p>
            </div>
            <div className="flex items-center gap-2">
              {[1, 2, 3, 4].map(s => (
                <div 
                  key={s} 
                  className={`w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                    step === s ? 'bg-primary text-white ring-4 ring-secondary-fixed' : step > s ? 'bg-secondary text-white' : 'bg-surface-container text-on-surface-variant'
                  }`}
                >
                  {s}
                </div>
              ))}
            </div>
          </div>

          {/* STEP 1: INFORMASI KERUSAKAN */}
          {step === 1 && (
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-on-surface mb-1">Judul Laporan Kerusakan:</label>
                <input 
                  type="text" 
                  value={title} 
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="Contoh: Lubang Menganga di Dekat Flyover Teknokrat"
                  className="w-full text-xs p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-secondary focus:outline-hidden"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-on-surface mb-2">Pilih Kategori Kerusakan:</label>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                  {CATEGORIES.map(c => (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => setCategory(c.id)}
                      className={`p-3 rounded-xl border text-left text-xs font-semibold flex items-center gap-2.5 transition-all ${
                        category === c.id ? 'border-secondary bg-secondary-fixed text-primary shadow-xs' : 'border-slate-200 hover:bg-slate-50 text-on-surface'
                      }`}
                    >
                      <i data-lucide={c.icon} className="w-4 h-4 text-secondary"></i>
                      <span>{c.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-on-surface mb-2">Tingkat Keparahan:</label>
                <div className="flex flex-wrap gap-4">
                  {['Ringan', 'Sedang', 'Berat'].map(sev => (
                    <label key={sev} className="flex items-center gap-2 text-xs font-medium cursor-pointer">
                      <input 
                        type="radio" 
                        name="severity" 
                        checked={severity === sev} 
                        onChange={() => setSeverity(sev)}

                      />
                      <span className={sev === 'Berat' ? 'text-red-600 font-bold' : ''}>{sev} {sev === 'Berat' && '(Membahayakan Jiwa)'}</span>
                    </label>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-on-surface mb-1">Uraian / Deskripsi Kondisi:</label>
                <textarea

          {/* STEP 3: UPLOAD FOTO DENGAN INPUT FILE ASLI & VALIDASI MAGIC BYTES */}
          {step === 3 && (
            <div className="space-y-4">
              <input

    // SEC-01 REMEDIATION: PETA LEAFLET BEBAS DOM XSS MENGGUNAKAN NODE TEXTCONTENT
    function PublicMap({ reports, onSelectReport }) {
      useEffect(() => {
        const mapEl = document.getElementById('public-gis-map');
        if (mapEl && !mapEl._leaflet_id) {
          const map = L.map('public-gis-map').setView([-5.397140, 105.266792], 12);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors | SMARTROAD Lampung'
          }).addTo(map);

          reports.forEach(r => {
            const marker = L.circleMarker([r.latitude, r.longitude], {
              radius: 8,
              fillColor: r.status === 'Selesai' ? '#16a34a' : r.status === 'Dalam Perbaikan' ? '#9333ea' : r.status === 'Ditolak' ? '#dc2626' : '#f97316',
              color: '#ffffff',
              weight: 2,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(map);

            // SEC-01: Buat DOM element secara aman (Immunized against XSS injection)
            const popupNode = document.createElement('div');
            popupNode.style.fontFamily = 'Inter, sans-serif';
            popupNode.style.fontSize = '12px';
            popupNode.style.width = '220px';

            const codeNode = document.createElement('strong');
            codeNode.style.color = '#002043';
            codeNode.style.fontSize = '13px';
            codeNode.textContent = r.report_code;

            const br1 = document.createElement('br');

            const titleNode = document.createElement('span');
            titleNode.textContent = r.title; // Aman: textContent tidak pernah mengeksekusi tag HTML

            const br2 = document.createElement('br');

            const statusNode = document.createElement('span');
            statusNode.style.display = 'inline-block';
            statusNode.style.marginTop = '4px';
            statusNode.style.padding = '2px 6px';
            statusNode.style.background = '#e2e8f0';
            statusNode.style.borderRadius = '4px';
            statusNode.style.fontWeight = 'bold';
            statusNode.textContent = r.status;

            popupNode.appendChild(codeNode);
            popupNode.appendChild(br1);
            popupNode.appendChild(titleNode);
            popupNode.appendChild(br2);
            popupNode.appendChild(statusNode);

            marker.bindPopup(popupNode);
            marker.on('click', () => onSelectReport(r));
          });
        }
      }, [reports]);

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="font-heading font-extrabold text-xl sm:text-2xl text-primary">Peta Spasial Kerusakan Jalan Lampung</h2>

            </div>
            <div className="flex flex-wrap items-center gap-3 bg-white px-4 py-2 rounded-xl border border-surface-container text-xs w-fit">
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-amber-500"></span> Menunggu</span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-purple-600"></span> Perbaikan</span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-emerald-600"></span> Selesai</span>

              {report.status === 'Selesai' && (
                <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs">
                  <div className="font-bold text-emerald-900 mb-1 flex items-center gap-1.5">
                    <i data-lucide="star" className="w-4 h-4 text-amber-500 fill-amber-500"></i>
                    Evaluasi & Ulasan Kepuasan Pelapor (Rating 5/5)
                  </div>
                  <p className="text-emerald-800 italic">"{report.feedback || 'Penanganan sangat cepat dan kondisi jalan sudah kembali mantap!'}"</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Render App into DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
